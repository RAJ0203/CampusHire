<!DOCTYPE html>
<html>
<head>
  <title>My Applications — CampusHire</title>
  <style>
    body { font-family: Arial; background: #f4f4f4; padding: 20px; }
    h2 { color: #333; }
    input, select { margin: 5px; padding: 8px; width: 200px; }
    button { padding: 8px 16px; background: #3b82f6; color: white; border: none; cursor: pointer; border-radius: 4px; }
    table { width: 100%; border-collapse: collapse; margin-top: 20px; background: white; }
    th, td { padding: 10px; border: 1px solid #ddd; text-align: left; }
    th { background: #3b82f6; color: white; }
  </style>
</head>
<body>

  <h2>My Applications</h2>

  <div>
    <input type="text" id="company" placeholder="Company name">
    <input type="text" id="role" placeholder="Role (SDE, Analyst)">
    <input type="date" id="date">
    <select id="status">
      <option>Applied</option>
      <option>Shortlisted</option>
      <option>Offered</option>
      <option>Rejected</option>
    </select>
    <button onclick="addApplication()">Add Application</button>
  </div>

  <table>
    <thead><tr>
      <th>Company</th><th>Role</th><th>Date</th><th>Status</th><th>Action</th>
    </tr></thead>
    <tbody id="appTable"></tbody>
  </table>

<script>
  const STUDENT_ID = 1;

  window.onload = loadApplications;

  function loadApplications() {
    fetch(`/api/applications/student/${STUDENT_ID}`)
      .then(r => r.json())
      .then(data => {
        const tbody = document.getElementById('appTable');
        tbody.innerHTML = data.map(a => `
          <tr>
            <td>${a.companyName}</td>
            <td>${a.role}</td>
            <td>${a.appliedDate}</td>
            <td>${a.status}</td>
            <td><button onclick="updateStatus(${a.id})">Update</button></td>
          </tr>`).join('');
      });
  }

  function addApplication() {
    const data = {
      studentId: STUDENT_ID,
      companyName: document.getElementById('company').value,
      role: document.getElementById('role').value,
      appliedDate: document.getElementById('date').value,
      status: document.getElementById('status').value
    };
    fetch('/api/applications', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(data)
    }).then(() => loadApplications());
  }

  function updateStatus(id) {
    const newStatus = prompt('New status? (Applied/Shortlisted/Offered/Rejected)');
    if (newStatus) {
      fetch(`/api/applications/${id}?status=${newStatus}`, {method: 'PUT'})
        .then(() => loadApplications());
    }
  }
</script>
</body>
</html>
