<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>CampusHire — Applications</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 800px; margin: 40px auto; padding: 0 20px; }
    h2 { color: #2c3e50; border-bottom: 2px solid #3498db; padding-bottom: 6px; }
    input, select { padding: 8px; margin: 5px; border: 1px solid #ccc; border-radius: 4px; width: 200px; }
    button { padding: 9px 18px; background: #3498db; color: white; border: none; border-radius: 4px; cursor: pointer; margin: 5px; }
    button:hover { background: #2980b9; }
    button.delete-btn { background: #e74c3c; }
    button.delete-btn:hover { background: #c0392b; }
    pre { background: #f4f4f4; padding: 15px; border-radius: 6px; overflow-x: auto; font-size: 13px; }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    th, td { border: 1px solid #ddd; padding: 8px; text-align: left; font-size: 13px; }
    th { background: #3498db; color: white; }
    tr:nth-child(even) { background: #f9f9f9; }
    .section { margin-bottom: 40px; }
  </style>
</head>
<body>
  <h1>📋 Applications Module</h1>

  <!-- POST -->
  <div class="section">
    <h2>➕ Submit New Application (POST)</h2>
    <input id="studentId"   type="number" placeholder="Student ID" />
    <input id="companyName" type="text"   placeholder="Company Name" />
    <input id="role"        type="text"   placeholder="Role" />
    <input id="appliedDate" type="date" />
    <select id="status">
      <option>Applied</option>
      <option>Shortlisted</option>
      <option>Offered</option>
      <option>Rejected</option>
    </select>
    <input id="packageLpa" type="number" placeholder="Package (LPA)" step="0.1" />
    <br/>
    <button onclick="submitApplication()">Submit Application</button>
    <pre id="postResult">—</pre>
  </div>

  <!-- GET -->
  <div class="section">
    <h2>🔍 View Applications by Student (GET)</h2>
    <input id="searchStudentId" type="number" placeholder="Student ID" />
    <button onclick="fetchApplications()">Fetch Applications</button>
    <div id="getResult">—</div>
  </div>

  <!-- PUT -->
  <div class="section">
    <h2>✏️ Update Application (PUT)</h2>
    <input id="updateId"      type="number" placeholder="Application ID" />
    <input id="updateCompany" type="text"   placeholder="Company Name" />
    <input id="updateRole"    type="text"   placeholder="Role" />
    <input id="updateDate"    type="date" />
    <select id="updateStatus">
      <option>Applied</option>
      <option>Shortlisted</option>
      <option>Offered</option>
      <option>Rejected</option>
    </select>
    <input id="updatePackage" type="number" placeholder="Package (LPA)" step="0.1" />
    <br/>
    <button onclick="updateApplication()">Update Application</button>
    <pre id="putResult">—</pre>
  </div>

<script>
  const BASE = "http://localhost:8080/api/applications";

  async function submitApplication() {
    const body = {
      studentId:   parseInt(document.getElementById("studentId").value),
      companyName: document.getElementById("companyName").value,
      role:        document.getElementById("role").value,
      appliedDate: document.getElementById("appliedDate").value,
      status:      document.getElementById("status").value,
      packageLpa:  parseFloat(document.getElementById("packageLpa").value)
    };
    const res = await fetch(BASE, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body)
    });
    document.getElementById("postResult").textContent =
      JSON.stringify(await res.json(), null, 2);
  }

  async function fetchApplications() {
    const sid = document.getElementById("searchStudentId").value;
    const res = await fetch(`${BASE}/student/${sid}`);
    const apps = await res.json();

    if (!apps.length) {
      document.getElementById("getResult").innerHTML = "<p>No applications found.</p>";
      return;
    }

    let html = `<table>
      <tr>
        <th>ID</th><th>Company</th><th>Role</th>
        <th>Date</th><th>Status</th><th>Package (LPA)</th><th>Actions</th>
      </tr>`;
    apps.forEach(a => {
      html += `<tr>
        <td>${a.id}</td>
        <td>${a.companyName}</td>
        <td>${a.role}</td>
        <td>${a.appliedDate}</td>
        <td>${a.status}</td>
        <td>${a.packageLpa ?? "—"}</td>
        <td>
          <button onclick="prefillUpdate(${a.id},'${a.companyName}','${a.role}','${a.appliedDate}','${a.status}',${a.packageLpa})">Edit</button>
        </td>
      </tr>`;
    });
    html += `</table>`;
    document.getElementById("getResult").innerHTML = html;
  }

  function prefillUpdate(id, company, role, date, status, pkg) {
    document.getElementById("updateId").value      = id;
    document.getElementById("updateCompany").value = company;
    document.getElementById("updateRole").value    = role;
    document.getElementById("updateDate").value    = date;
    document.getElementById("updateStatus").value  = status;
    document.getElementById("updatePackage").value = pkg;
    document.getElementById("putResult").textContent = "Fields pre-filled — edit and click Update.";
    window.scrollTo({ top: document.getElementById("putResult").offsetTop, behavior: "smooth" });
  }

  async function updateApplication() {
    const id = document.getElementById("updateId").value;
    if (!id) { alert("Please enter an Application ID."); return; }
    const body = {
      companyName: document.getElementById("updateCompany").value,
      role:        document.getElementById("updateRole").value,
      appliedDate: document.getElementById("updateDate").value,
      status:      document.getElementById("updateStatus").value,
      packageLpa:  parseFloat(document.getElementById("updatePackage").value)
    };
    const res = await fetch(`${BASE}/${id}`, {
      method: "PUT",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body)
    });
    document.getElementById("putResult").textContent =
      JSON.stringify(await res.json(), null, 2);
  }
</script>
</body>
</html>
